<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Resume-Gate report</title>
<!--
  Resume-Gate report template. To make a report:
  1. Copy this file to reports/<date>-checkup.html (or reports/<date>-<job-id>.html).
  2. Replace ONLY the JSON inside <script id="report-data">. Follow docs/REPORT.md.
  3. Never type scores or percentages: the script below counts the marks and computes them.
-->
<style>
:root{--bg:#FAFAF8;--ink:#1A1A1A;--ink2:#5C5A55;--soft:#D9D7D0;--track:#ECEBE6;--acc:#151515;--acc2:#858E96;--card:#FFFFFF;
 --sans:Inter,-apple-system,"Helvetica Neue","PingFang SC","Source Han Sans SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif;
 --mono:"JetBrains Mono","SF Mono",Menlo,Consolas,monospace}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased}
body{position:relative;min-height:100vh}
.bgmark{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;z-index:0;overflow:hidden}
.bgmark span{font-weight:800;font-size:17vw;letter-spacing:-.04em;color:#F1F0EC;white-space:nowrap;line-height:1}
.wrap{position:relative;z-index:1;max-width:980px;margin:0 auto;padding:48px 32px 32px}
.kicker{font-family:var(--mono);font-size:12px;letter-spacing:.14em;color:var(--ink2)}
h1{font-size:30px;line-height:1.2;margin:8px 0 6px;font-weight:700}
.meta{color:var(--ink2);font-size:14px;line-height:1.6}
.rule{border:0;border-top:1px solid var(--ink);margin:20px 0 28px}
.hero{display:grid;grid-template-columns:220px 1fr;gap:32px;align-items:center}
.ring{position:relative;width:200px;height:200px}
.ring svg{transform:rotate(-90deg)}
.ring .num{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .num b{font-size:56px;line-height:1;font-weight:700;font-variant-numeric:tabular-nums}
.ring .num small{font-family:var(--mono);font-size:11px;color:var(--ink2);letter-spacing:.08em;margin-top:6px}
.band{display:inline-block;border:1px solid var(--ink);padding:4px 10px;font-size:13px;font-weight:600;margin-bottom:12px}
.summary p{margin:0 0 8px;font-size:16px;line-height:1.55}
.summary p:first-child{font-weight:600}
h2{font-size:13px;font-family:var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--ink2);font-weight:500;margin:40px 0 14px;padding-bottom:8px;border-bottom:1px solid var(--soft)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.card{background:var(--card);border:1px solid var(--ink);border-top:3px solid var(--acc);padding:14px 16px 16px;position:relative}
.card.off{opacity:.45;border-top-color:var(--acc2)}
.stamp{font-family:var(--mono);font-size:10px;color:var(--acc2);letter-spacing:.06em}
.card .name{font-weight:600;font-size:16px;margin:6px 0 10px}
.bar{height:6px;background:var(--track)}
.bar i{display:block;height:100%;background:var(--ink)}
.card .val{display:flex;justify-content:space-between;font-size:13px;color:var(--ink2);margin-top:8px;font-variant-numeric:tabular-nums}
.card .val b{color:var(--ink);font-weight:600}
.two{display:grid;grid-template-columns:1fr 1fr;gap:28px}
.list{list-style:none;margin:0;padding:0;counter-reset:n}
.list li{border-top:1px solid var(--soft);padding:12px 0 12px 34px;position:relative}
.list li:first-child{border-top:0}
.list.num li::before{counter-increment:n;content:counter(n,decimal-leading-zero);position:absolute;left:0;top:13px;font-family:var(--mono);font-size:12px;color:var(--ink2)}
.list.dot li::before{content:"";position:absolute;left:4px;top:19px;width:10px;height:10px;background:var(--ink)}
.list .t{font-weight:600;font-size:15px}
.list .w{font-family:var(--mono);font-size:11px;color:var(--acc2);margin-left:6px}
.list .d{color:var(--ink2);font-size:14px;line-height:1.55;margin-top:3px}
table{width:100%;border-collapse:collapse;font-size:14px;background:var(--card);border:1px solid var(--ink)}
th{text-align:left;font-family:var(--mono);font-size:11px;letter-spacing:.06em;color:var(--ink2);font-weight:500;padding:10px 12px;border-bottom:1px solid var(--ink)}
td{padding:10px 12px;border-top:1px solid var(--soft);vertical-align:top;line-height:1.45}
td.c{text-align:center;white-space:nowrap}
.pill{display:inline-block;font-size:12px;padding:2px 8px;border:1px solid var(--ink)}
.pill.direct{background:var(--ink);color:#fff}
.pill.none{border-color:var(--acc2);color:var(--acc2)}
.ok{font-weight:700}.no{color:var(--acc2)}
.terms span{display:inline-block;margin:4px 6px 0 0;padding:3px 9px;font-size:13px;border:1px solid var(--ink)}
.terms span.miss{border-style:dashed;border-color:var(--acc2);color:var(--ink2)}
.prog .total{font-family:var(--mono);font-size:13px;margin-bottom:12px}
.prog .row{display:grid;grid-template-columns:1fr 160px 90px;gap:14px;align-items:center;padding:8px 0;border-top:1px solid var(--soft);font-size:14px}
.prog .row .s{font-family:var(--mono);font-size:11px;color:var(--ink2);text-align:right}
.checks{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.checks span{font-size:13px;padding:4px 10px;border:1px solid var(--ink);background:var(--card)}
.checks span.fail{border-style:dashed;border-color:var(--acc2);color:var(--ink2)}
details summary{cursor:pointer;font-size:14px;color:var(--ink2);margin-bottom:12px}
.method{margin-top:36px;font-size:12px;line-height:1.6;color:var(--ink2);max-width:760px}
footer{margin-top:28px;padding-top:12px;border-top:1px solid var(--ink);display:flex;justify-content:space-between;gap:16px;font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;color:var(--acc2)}
footer a{color:inherit;text-decoration:none}
.toolbar{position:sticky;top:0;z-index:5;display:flex;gap:8px;justify-content:flex-end;padding:10px 32px;background:rgba(250,250,248,.92);border-bottom:1px solid var(--soft)}
.toolbar button{font:inherit;font-size:13px;padding:6px 12px;border:1px solid var(--ink);background:var(--card);color:var(--ink);cursor:pointer}
.toolbar button.on{background:var(--ink);color:#fff}
.share{display:none;justify-content:center;padding:32px 16px 48px;position:relative;z-index:1}
body.sharing .wrap,body.sharing .bgmark{display:none}
.sc .std{font-family:var(--mono);font-size:10.5px;color:var(--ink2);letter-spacing:.04em;line-height:1.6;margin-top:10px}
body.sharing .share{display:flex;flex-direction:column;align-items:center}
.sc{width:540px;max-width:100%;aspect-ratio:4/5;background:var(--bg);border:1px solid var(--ink);position:relative;overflow:hidden;padding:36px 36px 28px;display:flex;flex-direction:column}
.sc .wm{position:absolute;left:-10px;right:-10px;top:46%;text-align:center;font-weight:800;font-size:96px;letter-spacing:-.04em;color:#F1F0EC;white-space:nowrap;z-index:0}
.sc>*{position:relative;z-index:1}
.sc .k{font-family:var(--mono);font-size:11px;letter-spacing:.14em;color:var(--ink2)}
.sc h3{margin:6px 0 0;font-size:22px}
.sc .mid{display:flex;align-items:center;gap:22px;margin:22px 0 18px}
.sc .mid .ring{width:150px;height:150px}
.sc .mid .ring .num b{font-size:44px}
.sc .dl{display:grid;grid-template-columns:1fr;gap:9px;margin-top:2px}
.sc .dl div{display:grid;grid-template-columns:86px 1fr 38px;gap:10px;align-items:center;font-size:13px}
.sc .dl div span:last-child{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.sc .cta{margin-top:auto;border-top:1px solid var(--ink);padding-top:14px}
.sc .cta b{display:block;font-size:17px;margin-bottom:6px}
.sc .cta .u{font-family:var(--mono);font-size:13px}
.sc .cta .st{display:inline-block;margin-top:10px;background:var(--ink);color:#fff;padding:6px 12px;font-size:13px;font-weight:600}
.sc .sig{position:absolute;right:36px;bottom:30px;font-family:var(--mono);font-size:10px;color:var(--acc2);letter-spacing:.06em}
.share .hint{margin-top:14px;font-size:13px;color:var(--ink2);max-width:540px;text-align:center}
@media (max-width:760px){.hero,.two{grid-template-columns:1fr}.grid{grid-template-columns:1fr 1fr}.wrap{padding:28px 16px}.prog .row{grid-template-columns:1fr 90px}.prog .row .bar{display:none}}
@media print{.toolbar{display:none}.bgmark{position:absolute}.wrap{padding:0}details{display:block}details>*{display:block}h2{break-after:avoid}.card,tr{break-inside:avoid}}
</style>
</head>

<script>
const L = {"kicker_checkup": "RESUME-GATE / CHECKUP", "kicker_job": "RESUME-GATE / JOB FIT", "mode_checkup": "Checkup", "mode_job": "Job fit", "score": "Score", "of100": "out of 100", "bands": ["Needs a rewrite", "Usable, but losing points", "Solid", "Strong"], "dims": "Dimensions", "notscored": "not scored", "weight": "weight", "strengths": "Strongest points", "fixes": "Fix these first", "jd": "JD coverage", "req": "Requirement", "cov": "Coverage", "top": "Near the top", "ev": "Evidence", "cov_direct": "Direct", "cov_partial": "Partial", "cov_none": "None", "yes": "Yes", "no": "No", "terms": "Key terms the evidence supports", "used": "used", "notused": "not used yet", "intake": "Interview progress", "item": "item", "questions": "questions", "details": "Every bullet, marked", "where": "Where", "bullet": "Bullet", "structure": "Structure checks", "summary": "Summary", "method": "Scored on the Resume-Gate checkup standard: Harvard career-office resume guides, common ATS advice, and this kit's sourcing rule. Not a recruiter's score; it doesn't predict interviews. Use it to compare versions of the same resume.", "view_full": "Full report", "view_share": "Share card", "share_hint": "Screenshot this card to share it. Your name, employer and bullets stay hidden.", "share_title": "My resume checkup", "share_cta": "Check your own resume. Free and open source.", "share_star": "★ Star it on GitHub", "share_std": "Resume-Gate checkup standard v1<br>Based on Harvard resume guides<br>and common ATS advice", "status": {"To do": "To do", "In progress": "In progress", "Done": "Done", "Skipped": "Skipped"}, "names": {"R1": "Results", "R2": "Numbers", "R3": "Action-led", "R4": "Specific", "R5": "Structure", "R6": "Sourced", "J1": "JD coverage", "J2": "Placement", "J3": "Wording"}};
const WEIGHTS = {R1:25,R2:20,R3:15,R4:10,R5:15,R6:15,J1:30,J2:15,J3:10};
const D = JSON.parse(document.getElementById("report-data").textContent);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const job = D.meta.mode === "job";
const B = D.bullets || [];
const frac = (n, d) => ({n, d, p: d ? n / d : 0});
const count = k => frac(B.filter(b => b[k]).length, B.length);
const reqs = (D.jd && D.jd.requirements) || [];
const covered = reqs.filter(r => r.coverage !== "none");
const terms = (D.jd && D.jd.terms) || {supported: [], used: []};
const usedSupported = terms.supported.filter(t => terms.used.includes(t));
const R = {
  R1: count("result"), R2: count("number"), R3: count("action"), R4: count("specific"),
  R5: frac((D.structure || []).filter(c => c.pass).length, (D.structure || []).length),
  R6: count("sourced"),
  J1: {n: reqs.filter(r => r.coverage === "direct").length + 0.5 * reqs.filter(r => r.coverage === "partial").length, d: reqs.length},
  J2: frac(covered.filter(r => r.top).length, covered.length),
  J3: frac(usedSupported.length, terms.supported.length),
};
R.J1.p = R.J1.d ? R.J1.n / R.J1.d : 0;
const ids = ["R1","R2","R3","R4","R5","R6"].concat(job ? ["J1","J2","J3"] : []);
const on = id => (D.dims ? D.dims[id] !== false : true) && R[id].d > 0;
let wsum = 0, acc = 0;
ids.filter(on).forEach(id => { wsum += WEIGHTS[id]; acc += WEIGHTS[id] * R[id].p; });
const score = wsum ? Math.round(acc / wsum * 100) : 0;
const band = score >= 85 ? L.bands[3] : score >= 70 ? L.bands[2] : score >= 55 ? L.bands[1] : L.bands[0];
const pct = x => Math.round(x * 100) + "%";
const fmt = r => (Number.isInteger(r.n) ? r.n : r.n.toFixed(1)) + " / " + r.d;
const C = 2 * Math.PI * 88;

let h = "";
h += `<div class="kicker">${job ? L.kicker_job : L.kicker_checkup}</div>`;
h += `<h1>${esc(D.meta.name)} · ${esc(D.meta.title)}</h1>`;
h += `<div class="meta">${esc(D.meta.date)} · ${job ? L.mode_job : L.mode_checkup}${D.meta.target ? " · " + esc(D.meta.target) : ""}<br>${esc(D.meta.file || "")}</div>`;
h += `<hr class="rule">`;
h += `<section class="hero"><div class="ring"><svg width="200" height="200" viewBox="0 0 200 200"><circle cx="100" cy="100" r="88" fill="none" stroke="#ECEBE6" stroke-width="10"/><circle cx="100" cy="100" r="88" fill="none" stroke="#1A1A1A" stroke-width="10" stroke-dasharray="${C * score / 100} ${C}"/></svg><div class="num"><b>${score}</b><small>${L.of100.toUpperCase()}</small></div></div>`;
h += `<div class="summary"><div class="band">${band}</div>${(D.summary || []).map(s => `<p>${esc(s)}</p>`).join("")}</div></section>`;

h += `<h2>${L.dims}</h2><div class="grid">`;
ids.forEach(id => {
  const r = R[id], o = on(id);
  h += `<div class="card${o ? "" : " off"}"><div class="stamp">RG // ${id}</div><div class="name">${L.names[id]}</div><div class="bar"><i style="width:${o ? pct(r.p) : 0}"></i></div><div class="val"><span>${o ? fmt(r) : L.notscored}</span><b>${o ? pct(r.p) : "-"}</b></div></div>`;
});
h += `</div>`;
if ((D.structure || []).length) h += `<div class="checks">${D.structure.map(c => `<span class="${c.pass ? "" : "fail"}">${c.pass ? "✓" : "✕"} ${esc(c.check)}</span>`).join("")}</div>`;

h += `<div class="two"><div><h2>${L.strengths}</h2><ul class="list dot">${(D.strengths || []).map(s => `<li><div class="t">${esc(s.title)}</div><div class="d">${esc(s.why)}</div></li>`).join("")}</ul></div>`;
h += `<div><h2>${L.fixes}</h2><ol class="list num">${(D.fixes || []).slice(0, 5).map(f => `<li><div class="t">${esc(f.issue)}<span class="w">${esc(f.where)}</span></div><div class="d">${esc(f.fix)}</div></li>`).join("")}</ol></div></div>`;

if (job && reqs.length) {
  const cv = {direct: L.cov_direct, partial: L.cov_partial, none: L.cov_none};
  h += `<h2>${L.jd}</h2><table><tr><th>${L.req}</th><th>${L.cov}</th><th>${L.top}</th><th>${L.ev}</th></tr>`;
  reqs.forEach(r => { h += `<tr><td>${esc(r.req)}</td><td><span class="pill ${r.coverage}">${cv[r.coverage]}</span></td><td class="c">${r.coverage === "none" ? "-" : (r.top ? `<span class="ok">${L.yes}</span>` : `<span class="no">${L.no}</span>`)}</td><td>${esc(r.evidence)}</td></tr>`; });
  h += `</table>`;
  if (terms.supported.length) h += `<div class="terms" style="margin-top:14px"><div class="meta">${L.terms}: ${usedSupported.length} ${L.used} · ${terms.supported.length - usedSupported.length} ${L.notused}</div>${terms.supported.map(t => `<span class="${terms.used.includes(t) ? "" : "miss"}">${esc(t)}</span>`).join("")}</div>`;
}

const items = (D.intake && D.intake.items) || [];
if (items.length) {
  const a = items.reduce((s, i) => s + i.asked, 0), p = items.reduce((s, i) => s + i.planned, 0);
  const cells = 15, f = p ? Math.round(cells * a / p) : 0;
  h += `<h2>${L.intake}</h2><div class="prog"><div class="total">${"▓".repeat(f)}${"░".repeat(cells - f)} ${a}/${p}</div>`;
  items.forEach((i, k) => { h += `<div class="row"><span>${k + 1}. ${esc(i.name)}</span><div class="bar"><i style="width:${i.planned ? pct(i.asked / i.planned) : 0}"></i></div><span class="s">${i.asked}/${i.planned} · ${L.status[i.status] || esc(i.status)}</span></div>`; });
  h += `</div>`;
}

if (B.length) {
  const mk = v => v ? `<span class="ok">✓</span>` : `<span class="no">–</span>`;
  h += `<h2>${L.details}</h2><details open><summary>${B.length} bullets</summary><table><tr><th>${L.where}</th><th>${L.bullet}</th><th>R1</th><th>R2</th><th>R3</th><th>R4</th><th>R6</th></tr>`;
  B.forEach(b => { h += `<tr><td style="white-space:nowrap">${esc(b.where)}</td><td>${esc(b.text)}</td><td class="c">${mk(b.result)}</td><td class="c">${mk(b.number)}</td><td class="c">${mk(b.action)}</td><td class="c">${mk(b.specific)}</td><td class="c">${mk(b.sourced)}</td></tr>`; });
  h += `</table></details>`;
}

h += `<p class="method">${L.method}</p>`;
h += `<footer><span>MADE WITH RESUME-GATE · <a href="https://github.com/weareheya/Resume-Gate">GITHUB.COM/WEAREHEYA/RESUME-GATE</a></span><span>STANDARD v1 · KIT ${esc(D.meta.kit_version || "")} · © 2026 HeyEstella</span></footer>`;
document.getElementById("app").innerHTML = h;
document.title = (job ? L.mode_job : L.mode_checkup) + " · " + D.meta.name + " · " + score;

// Share card: score, band and dimension bars only. No name, employer, target or bullet text unless meta.share_name is set.
const c2 = 2 * Math.PI * 66;
let s = `<div class="sc"><div class="wm" aria-hidden="true">RESUME-GATE</div>`;
s += `<div class="k">RESUME-GATE / ${job ? L.mode_job.toUpperCase() : L.mode_checkup.toUpperCase()}</div><h3>${esc(D.meta.share_name || L.share_title)}</h3>`;
s += `<div class="mid"><div class="ring"><svg width="150" height="150" viewBox="0 0 150 150"><circle cx="75" cy="75" r="66" fill="none" stroke="#ECEBE6" stroke-width="9"/><circle cx="75" cy="75" r="66" fill="none" stroke="#1A1A1A" stroke-width="9" stroke-dasharray="${c2 * score / 100} ${c2}"/></svg><div class="num"><b>${score}</b><small>${L.of100.toUpperCase()}</small></div></div><div><div class="band">${band}</div><div class="std">${L.share_std}</div></div></div>`;
s += `<div class="dl">${ids.filter(on).map(id => `<div><span>${L.names[id]}</span><div class="bar"><i style="width:${pct(R[id].p)}"></i></div><span>${pct(R[id].p)}</span></div>`).join("")}</div>`;
s += `<div class="cta"><b>${L.share_cta}</b><span class="u">github.com/weareheya/Resume-Gate</span><br><span class="st">${L.share_star}</span></div>`;
s += `<div class="sig">by HeyEstella</div></div><p class="hint">${L.share_hint}</p>`;
document.getElementById("share").innerHTML = s;

const tb = document.getElementById("toolbar");
const setView = v => { document.body.classList.toggle("sharing", v === "share"); tb.innerHTML = `<button class="${v !== "share" ? "on" : ""}" data-v="full">${L.view_full}</button><button class="${v === "share" ? "on" : ""}" data-v="share">${L.view_share}</button>`; };
tb.addEventListener("click", e => { const v = e.target.dataset && e.target.dataset.v; if (v) { location.hash = v === "share" ? "share" : ""; setView(v); } });
setView(location.hash === "#share" ? "share" : "full");
</script>
</body>
</html>
